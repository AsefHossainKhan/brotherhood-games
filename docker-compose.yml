services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brotherhood-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BACKEND_PORT=${BACKEND_PORT:-3001}
      - CORS_ORIGIN=http://localhost
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brotherhood

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    container_name: brotherhood-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - brotherhood

  nginx:
    image: nginx:alpine
    container_name: brotherhood-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - brotherhood

  db:
    image: mysql:8.0
    container_name: brotherhood-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: brotherhood_games
      MYSQL_USER: ${MYSQL_USER:-brotherhood}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-brotherhood_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brotherhood

volumes:
  mysql_data:

networks:
  brotherhood:
    driver: bridge
